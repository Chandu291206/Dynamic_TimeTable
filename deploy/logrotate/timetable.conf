# Logrotate configuration for Timetable Management System
# Place in /etc/logrotate.d/timetable

/var/log/timetable/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        # Signal PM2 or systemd to reload log file descriptors
        if command -v pm2 >/dev/null 2>&1; then
            pm2 reloadLogs >/dev/null 2>&1 || true
        fi
        if systemctl is-active --quiet timetable-backend; then
            systemctl reload timetable-backend >/dev/null 2>&1 || true
        fi
    endscript
}
